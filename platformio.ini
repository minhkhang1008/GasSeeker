[platformio]
default_envs = robot
src_dir = src

[env]
build_flags = -Wall

[esp_common]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = qio
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_unflags = -std=gnu++11
lib_deps =
    jgromes/RadioLib@^7.1.2

[env:robot]
extends = esp_common
build_src_filter = -<*> +<core/> +<lora/> +<robot/>

[env:base]
extends = esp_common
build_src_filter = -<*> +<core/> +<lora/> +<base/>

[env:test]
platform = native
build_src_filter = -<*> +<core/> +<sim/> -<sim/main.cpp> +<test/>
build_flags =
    -std=gnu++17
    -O1
    -Wall
    -DGS_SIM=1

[env:sim]
platform = native
build_src_filter = -<*> +<core/> +<sim/>
build_flags =
    -std=gnu++17
    -O2
    -Wall
    -DGS_SIM=1

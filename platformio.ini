; GasSeeker - Robot tu hanh do tim nguon ro ri khi bang cam bien don
;
; 3 target:
;   robot : firmware ESP32-S3 tren xe        -> pio run -e robot -t upload
;   base  : firmware ESP32-S3 tram thu LoRa  -> pio run -e base  -t upload
;   sim    : mo phong chay tren macOS         -> pio run -e sim && .pio/build/sim/program
;
; Ca 3 target dung chung thu muc src/core/ (code thuat toan, khong phu thuoc Arduino).

[platformio]
default_envs = robot
src_dir = src

[env]
build_flags = -Wall

; ---------------------------------------------------------------- ESP32-S3
[esp_common]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = qio
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_unflags = -std=gnu++11
lib_deps =
    jgromes/RadioLib@^7.1.2

[env:robot]
extends = esp_common
build_src_filter = -<*> +<core/> +<lora/> +<robot/>

[env:base]
extends = esp_common
build_src_filter = -<*> +<core/> +<lora/> +<base/>

; ------------------------------------------------- Test tu dong cho src/core/
; Chay:  pio run -e test && ./.pio/build/test/program
[env:test]
platform = native
; Dung lai mo hinh cua simulator lam robot gia, tru file main.cpp cua no.
build_src_filter = -<*> +<core/> +<sim/> -<sim/main.cpp> +<test/>
build_flags =
    -std=gnu++17
    -O1
    -Wall
    -DGS_SIM=1

; ---------------------------------------------------------------- Simulator
[env:sim]
platform = native
build_src_filter = -<*> +<core/> +<sim/>
build_flags =
    -std=gnu++17
    -O2
    -Wall
    -DGS_SIM=1

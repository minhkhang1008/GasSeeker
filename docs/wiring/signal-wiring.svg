<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050"><defs><style> .title { font: bold 36px Arial, sans-serif; fill: #1f2937; } .subtitle { font: 18px Arial, sans-serif; fill: #475569; } .box { fill: white; stroke: #334155; stroke-width: 2.2; rx: 18; } .label { font: bold 20px Arial, sans-serif; fill: #111827; text-anchor: middle; } .small { font: 15px Arial, sans-serif; fill: #334155; text-anchor: middle; } .pin { font: 16px Arial, sans-serif; fill: #111827; } .wire { fill: none; stroke-width: 4.5; } .note { font: 16px Arial, sans-serif; fill: #7c2d12; } </style><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#334155"/></marker></defs><rect x="0" y="0" width="1600" height="1050" fill="#f8fafc"/><text x="60" y="60" class="title">GasSeeker — signal wiring</text><text x="60" y="92" class="subtitle">This diagram shows GPIO-to-module connections. Power rails are omitted here; use power-wiring.svg for VCC/GND routing.</text><rect x="575" y="210" width="450" height="550" class="box" fill="#fdf2f8"/><text x="800" y="255" class="label">ESP32-S3 board</text><text x="800" y="282" class="small">Use the pink board pin labels from esp32-pinout.svg</text><g><text x="615" y="330" class="pin">GPIO1 ← HC-020K OUT</text><text x="615" y="365" class="pin">GPIO4 ← MQ-3 divider node</text><text x="615" y="400" class="pin">GPIO5 → LEFT PWMA</text><text x="615" y="435" class="pin">GPIO6 → LEFT AIN1</text><text x="615" y="470" class="pin">GPIO7 → LEFT AIN2</text><text x="615" y="505" class="pin">GPIO8 ↔ MPU6050 SDA</text><text x="615" y="540" class="pin">GPIO9 ↔ MPU6050 SCL</text><text x="615" y="575" class="pin">GPIO10 → LoRa NSS</text><text x="615" y="610" class="pin">GPIO11 → LoRa MOSI</text><text x="615" y="645" class="pin">GPIO12 → LoRa SCK</text><text x="615" y="680" class="pin">GPIO13 ← LoRa MISO</text><text x="615" y="715" class="pin">GPIO14 → LoRa RST</text></g><g><text x="835" y="330" class="pin">GPIO15 → RIGHT PWMB</text><text x="835" y="365" class="pin">GPIO16 → RIGHT BIN1</text><text x="835" y="400" class="pin">GPIO17 → RIGHT BIN2</text><text x="835" y="435" class="pin">GPIO18 → STBY (both TB6612)</text><text x="835" y="470" class="pin">GPIO21 ← LoRa BUSY</text><text x="835" y="505" class="pin">GPIO38 ← bumper switch</text><text x="835" y="540" class="pin">GPIO47 ← LoRa DIO1</text><text x="835" y="575" class="pin">GPIO48 = onboard RGB LED</text><text x="835" y="610" class="pin">GPIO0 = onboard BOOT button</text><text x="835" y="645" class="pin">GPIO2 = not used</text><text x="835" y="680" class="pin">GPIO39 = not used</text></g><rect x="120" y="250" width="250" height="110" class="box"/><text x="245" y="302" class="label">HC-020K encoder</text><text x="245" y="332" class="small">Single encoder on RL wheel</text><rect x="100" y="430" width="310" height="170" class="box"/><text x="255" y="480" class="label">MQ-3 + divider</text><text x="255" y="510" class="small">AO → 10k → node → GPIO4</text><text x="255" y="535" class="small">node → 20k → GND</text><text x="255" y="560" class="small">optional 100 nF from node to GND</text><rect x="180" y="700" width="190" height="110" class="box"/><text x="275" y="752" class="label">MPU6050</text><text x="275" y="782" class="small">I²C on GPIO8/9</text><rect x="1230" y="250" width="250" height="180" class="box"/><text x="1355" y="300" class="label">LoRa SX1262</text><text x="1355" y="330" class="small">NSS, MOSI, SCK, MISO</text><text x="1355" y="355" class="small">RST, BUSY, DIO1</text><rect x="1220" y="500" width="270" height="190" class="box"/><text x="1355" y="550" class="label">TB6612 #1</text><text x="1355" y="580" class="small">Drives FL + FR</text><text x="1355" y="605" class="small">PWMA/AIN1/AIN2</text><text x="1355" y="630" class="small">PWMB/BIN1/BIN2</text><text x="1355" y="655" class="small">STBY</text><rect x="1220" y="750" width="270" height="190" class="box"/><text x="1355" y="800" class="label">TB6612 #2</text><text x="1355" y="830" class="small">Drives RL + RR</text><text x="1355" y="855" class="small">Receives same control signals</text><text x="1355" y="880" class="small">as TB6612 #1</text><rect x="1150" y="120" width="340" height="90" class="box"/><text x="1320" y="168" class="label">Front bumper switch (V156)</text><text x="1320" y="192" class="small">COM → GND, NO → GPIO38</text><path class="wire" stroke="#65a30d" marker-end="url(#arrow)" d="M370 305 H520 V330 H575"/><text x="430" y="292" class="small">OUT → GPIO1</text><path class="wire" stroke="#7c3aed" marker-end="url(#arrow)" d="M410 510 H500 V365 H575"/><text x="455" y="498" class="small">Divider node → GPIO4</text><path class="wire" stroke="#0284c7" marker-end="url(#arrow)" d="M370 745 H500 V505 H575"/><text x="437" y="728" class="small">SDA → GPIO8</text><path class="wire" stroke="#0284c7" marker-end="url(#arrow)" d="M370 775 H520 V540 H575"/><text x="450" y="806" class="small">SCL → GPIO9</text><path class="wire" stroke="#059669" marker-end="url(#arrow)" d="M1025 575 H1120 V320 H1230"/><text x="1090" y="560" class="small">GPIO10 → NSS</text><path class="wire" stroke="#059669" marker-end="url(#arrow)" d="M1025 610 H1140 V345 H1230"/><text x="1112" y="596" class="small">GPIO11 → MOSI</text><path class="wire" stroke="#059669" marker-end="url(#arrow)" d="M1025 645 H1160 V370 H1230"/><text x="1130" y="632" class="small">GPIO12 → SCK</text><path class="wire" stroke="#10b981" marker-end="url(#arrow)" d="M1230 395 H1140 V680 H1025"/><text x="1125" y="695" class="small">MISO → GPIO13</text><path class="wire" stroke="#059669" marker-end="url(#arrow)" d="M1025 715 H1125 V285 H1230"/><text x="1088" y="732" class="small">GPIO14 → RST</text><path class="wire" stroke="#10b981" marker-end="url(#arrow)" d="M1230 350 H1100 V470 H1025"/><text x="1110" y="455" class="small">BUSY → GPIO21</text><path class="wire" stroke="#10b981" marker-end="url(#arrow)" d="M1230 375 H1085 V540 H1025"/><text x="1120" y="528" class="small">DIO1 → GPIO47</text><path class="wire" stroke="#ea580c" marker-end="url(#arrow)" d="M1025 400 H1140 V560 H1220"/><text x="1120" y="385" class="small">GPIO5 → PWMA</text><path class="wire" stroke="#ea580c" marker-end="url(#arrow)" d="M1025 435 H1160 V585 H1220"/><text x="1138" y="421" class="small">GPIO6 → AIN1</text><path class="wire" stroke="#ea580c" marker-end="url(#arrow)" d="M1025 470 H1180 V610 H1220"/><text x="1158" y="456" class="small">GPIO7 → AIN2</text><path class="wire" stroke="#ea580c" marker-end="url(#arrow)" d="M1025 330 H1190 V635 H1220"/><text x="1168" y="317" class="small">GPIO15 → PWMB</text><path class="wire" stroke="#ea580c" marker-end="url(#arrow)" d="M1025 365 H1170 V660 H1220"/><text x="1150" y="350" class="small">GPIO16 → BIN1</text><path class="wire" stroke="#ea580c" marker-end="url(#arrow)" d="M1025 400 H1200 V685 H1220"/><text x="1180" y="706" class="small">GPIO17 → BIN2</text><path class="wire" stroke="#dc2626" marker-end="url(#arrow)" d="M1025 435 H1210 V710 H1220"/><text x="1180" y="422" class="small">GPIO18 → STBY</text><path class="wire" stroke="#fb923c" marker-end="url(#arrow)" d="M1220 560 H1160 V810 H1220"/><text x="1145" y="796" class="small">Same 7 control lines</text><path class="wire" stroke="#fb923c" marker-end="url(#arrow)" d="M1220 585 H1140 V835 H1220"/><path class="wire" stroke="#fb923c" marker-end="url(#arrow)" d="M1220 610 H1120 V860 H1220"/><path class="wire" stroke="#fb923c" marker-end="url(#arrow)" d="M1220 635 H1100 V885 H1220"/><path class="wire" stroke="#fb923c" marker-end="url(#arrow)" d="M1220 660 H1080 V910 H1220"/><path class="wire" stroke="#fb923c" marker-end="url(#arrow)" d="M1220 685 H1060 V935 H1220"/><path class="wire" stroke="#fb923c" marker-end="url(#arrow)" d="M1220 710 H1040 V960 H1220"/><path class="wire" stroke="#be123c" marker-end="url(#arrow)" d="M1150 165 H1100 V505 H1025"/><text x="1120" y="150" class="small">NO → GPIO38</text><g transform="translate(70,860)"><rect x="0" y="0" width="980" height="130" rx="16" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><text x="20" y="34" class="label" text-anchor="start">Important notes</text><text x="20" y="62" class="note">1) GPIO5/6/7/15/16/17/18 must go to BOTH TB6612 boards in parallel.</text><text x="20" y="88" class="note">2) The MQ-3 line into GPIO4 must come from the voltage-divider node, not directly from MQ-3 AO.</text><text x="20" y="114" class="note">3) The bumper uses only one switch: COM → GND and NO → GPIO38. GPIO39 is unused.</text></g></svg>
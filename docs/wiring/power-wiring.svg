<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980"><defs><style> .title { font: bold 36px Arial, sans-serif; fill: #1f2937; } .subtitle { font: 18px Arial, sans-serif; fill: #475569; } .box { fill: white; stroke: #334155; stroke-width: 2.2; rx: 18; } .label { font: bold 20px Arial, sans-serif; fill: #111827; text-anchor: middle; } .small { font: 16px Arial, sans-serif; fill: #334155; text-anchor: middle; } .wire { fill: none; stroke-width: 5; } .legend { font: 16px Arial, sans-serif; fill: #334155; } </style><marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#dc2626"/></marker><marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#ea580c"/></marker><marker id="arrowBlack" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#111827"/></marker></defs><rect x="0" y="0" width="1500" height="980" fill="#f8fafc"/><text x="60" y="60" class="title">GasSeeker — power wiring</text><text x="60" y="92" class="subtitle">This diagram only shows power rails and ground. Connect signal wires using the separate signal-wiring.svg file.</text><rect x="70" y="180" width="210" height="120" class="box"/><text x="175" y="232" class="label">2S 18650 pack</text><text x="175" y="262" class="small">6.0–8.4 V</text><text x="175" y="286" class="small">Main battery</text><rect x="355" y="180" width="170" height="120" class="box"/><text x="440" y="232" class="label">Fuse 5 A</text><text x="440" y="262" class="small">On BAT+ line</text><rect x="600" y="180" width="170" height="120" class="box"/><text x="685" y="232" class="label">KCD1 switch</text><text x="685" y="262" class="small">Main ON/OFF</text><rect x="860" y="120" width="220" height="150" class="box"/><text x="970" y="175" class="label">XL4015 #1</text><text x="970" y="205" class="small">Set output to 6.0 V</text><text x="970" y="230" class="small">Motor power rail</text><rect x="860" y="330" width="220" height="150" class="box"/><text x="970" y="385" class="label">LM2596</text><text x="970" y="415" class="small">Set output to 5.0 V</text><text x="970" y="440" class="small">ESP32 + MQ-3 rail</text><rect x="1180" y="70" width="240" height="150" class="box"/><text x="1300" y="125" class="label">TB6612 #1</text><text x="1300" y="155" class="small">VM = 6 V</text><text x="1300" y="180" class="small">Drives FL + FR</text><rect x="1180" y="250" width="240" height="150" class="box"/><text x="1300" y="305" class="label">TB6612 #2</text><text x="1300" y="335" class="small">VM = 6 V</text><text x="1300" y="360" class="small">Drives RL + RR</text><rect x="1180" y="470" width="240" height="160" class="box"/><text x="1300" y="525" class="label">ESP32-S3 board</text><text x="1300" y="555" class="small">5V / VIN from LM2596</text><text x="1300" y="580" class="small">Then use board 3V3 output</text><rect x="1180" y="680" width="240" height="120" class="box"/><text x="1300" y="732" class="label">MQ-3 module</text><text x="1300" y="762" class="small">VCC = 5 V</text><rect x="980" y="620" width="160" height="90" class="box"/><text x="1060" y="658" class="label">3V3 rail</text><text x="1060" y="684" class="small">From ESP32 board</text><rect x="760" y="620" width="170" height="95" class="box"/><text x="845" y="658" class="label">MPU6050</text><text x="845" y="684" class="small">VCC = 3V3</text><rect x="760" y="750" width="170" height="95" class="box"/><text x="845" y="788" class="label">LoRa SX1262</text><text x="845" y="814" class="small">VCC = 3V3</text><rect x="760" y="880" width="170" height="75" class="box"/><text x="845" y="924" class="label">HC-020K encoder</text><text x="845" y="944" class="small">VCC = 3V3 (per current WIRING.md)</text><path class="wire" stroke="#dc2626" marker-end="url(#arrowRed)" d="M280 240 H355"/><path class="wire" stroke="#dc2626" marker-end="url(#arrowRed)" d="M525 240 H600"/><path class="wire" stroke="#dc2626" d="M770 240 H805 V195 H860"/><path class="wire" stroke="#dc2626" marker-end="url(#arrowRed)" d="M805 240 V405 H860"/><text x="818" y="180" class="small">BAT+</text><path class="wire" stroke="#ea580c" marker-end="url(#arrowOrange)" d="M1080 195 H1120 V145 H1180"/><path class="wire" stroke="#ea580c" marker-end="url(#arrowOrange)" d="M1120 195 V325 H1180"/><text x="1110" y="134" class="small">6V VM</text><path class="wire" stroke="#f59e0b" marker-end="url(#arrowOrange)" d="M1080 405 H1120 V550 H1180"/><path class="wire" stroke="#f59e0b" marker-end="url(#arrowOrange)" d="M1120 405 V740 H1180"/><text x="1110" y="533" class="small">5V</text><path class="wire" stroke="#16a34a" marker-end="url(#arrowOrange)" d="M1180 590 H1060 V620"/><path class="wire" stroke="#16a34a" marker-end="url(#arrowOrange)" d="M1060 710 H930 V667 H930"/><path class="wire" stroke="#16a34a" marker-end="url(#arrowOrange)" d="M1060 710 H930 V797 H930"/><path class="wire" stroke="#16a34a" marker-end="url(#arrowOrange)" d="M1060 710 H930 V918 H930"/><path class="wire" stroke="#16a34a" marker-end="url(#arrowOrange)" d="M1060 620 V150 H1180"/><path class="wire" stroke="#16a34a" marker-end="url(#arrowOrange)" d="M1060 620 V330 H1180"/><text x="1090" y="640" class="small">3V3</text><path class="wire" stroke="#111827" d="M175 310 V900 H1420"/><path class="wire" stroke="#111827" marker-end="url(#arrowBlack)" d="M440 300 V900"/><path class="wire" stroke="#111827" marker-end="url(#arrowBlack)" d="M685 300 V900"/><path class="wire" stroke="#111827" marker-end="url(#arrowBlack)" d="M970 270 V900"/><path class="wire" stroke="#111827" marker-end="url(#arrowBlack)" d="M970 480 V900"/><path class="wire" stroke="#111827" marker-end="url(#arrowBlack)" d="M1300 220 V900"/><path class="wire" stroke="#111827" marker-end="url(#arrowBlack)" d="M1300 400 V900"/><path class="wire" stroke="#111827" marker-end="url(#arrowBlack)" d="M1300 630 V900"/><path class="wire" stroke="#111827" marker-end="url(#arrowBlack)" d="M1300 800 V900"/><path class="wire" stroke="#111827" marker-end="url(#arrowBlack)" d="M845 715 V900"/><path class="wire" stroke="#111827" marker-end="url(#arrowBlack)" d="M845 845 V900"/><path class="wire" stroke="#111827" marker-end="url(#arrowBlack)" d="M845 955 V900"/><text x="180" y="928" class="small" text-anchor="start">Common GND bus — all modules must share ground</text><g transform="translate(70,720)"><rect x="0" y="0" width="590" height="190" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="20" y="32" class="label" text-anchor="start">Legend</text><line x1="25" y1="58" x2="95" y2="58" stroke="#dc2626" stroke-width="5"/><text x="110" y="64" class="legend">Battery positive before buck conversion</text><line x1="25" y1="88" x2="95" y2="88" stroke="#ea580c" stroke-width="5"/><text x="110" y="94" class="legend">6V motor rail from XL4015</text><line x1="25" y1="118" x2="95" y2="118" stroke="#f59e0b" stroke-width="5"/><text x="110" y="124" class="legend">5V logic rail from LM2596</text><line x1="25" y1="148" x2="95" y2="148" stroke="#16a34a" stroke-width="5"/><text x="110" y="154" class="legend">3V3 rail generated by ESP32 board</text><line x1="25" y1="178" x2="95" y2="178" stroke="#111827" stroke-width="5"/><text x="110" y="184" class="legend">Ground return / common ground</text></g><text x="60" y="950" class="subtitle">Set XL4015 to 6.0 V and LM2596 to 5.0 V before plugging boards in. Do not power the LoRa module from 5 V.</text></svg>